name: MALRAUX ENTRE2 return DIGIYLYFE one-shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible DIGIYLYFE return
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<body class="malraux" id="body">\n'
          button = '''<body class="malraux" id="body">\n\n<a href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="position:fixed;top:64px;left:12px;z-index:1000001;width:min(360px,calc(100vw - 24px));min-height:52px;display:flex;align-items:center;justify-content:center;padding:11px 18px;border:2px solid #c99743;border-radius:999px;background:#241d15;color:#fff;text-decoration:none;font:1000 15px/1.2 Arial,sans-serif;letter-spacing:.02em;box-shadow:0 10px 28px rgba(0,0,0,.34)">← RETOUR DIGIYLYFE.COM</a>\n'''
          if '← RETOUR DIGIYLYFE.COM' in s:
              raise SystemExit('Return already present; no change made')
          if marker not in s:
              raise SystemExit('Body marker not found; no change made')
          s = s.replace(marker, button, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "UI: add visible DIGIYLYFE.COM return on Malraux Entre2" || exit 0
          git push

