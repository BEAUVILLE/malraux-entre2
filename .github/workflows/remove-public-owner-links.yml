name: Retirer les accès adhérent publics RESA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-public-owner-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer les portes propriétaire de la vitrine publique
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          before=s
          s=re.sub(r'\s*<a href="https://resto\.digiylyfe\.com/resa-resto/gestion\.html\?site=(?:le-malraux-sarlat|entre2-sarlat)"[^>]*>Espace adhérent</a>\s*', '\n', s)
          if s==before:
              raise SystemExit('Aucun lien Espace adhérent RESA trouvé')
          if 'gestion.html?site=le-malraux-sarlat' in s or 'gestion.html?site=entre2-sarlat' in s:
              raise SystemExit('Un lien propriétaire est encore présent')
          p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html
          git commit -m 'Retirer les accès adhérent RESA de la vitrine publique'
          git push
